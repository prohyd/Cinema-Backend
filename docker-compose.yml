version: "3.9"

services:
  db:
    image: postgres:15
    container_name: cinema_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cinema_app
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn controller.movie.routes:cinema_backend --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"

volumes:
  postgres_data: